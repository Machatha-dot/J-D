<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J&D Shop</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #2c3e50;
        }

        /* ================= HEADER ================= */

        header {
            background: #17202a;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #2ecc71;
        }

        #cart-count {
            background: #e74c3c;
            color: white;
            padding: 3px 8px;
            border-radius: 50%;
            font-size: 12px;
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 480px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            color: white;

            padding: 30px;

            background:
                linear-gradient(
                    rgba(0,0,0,0.65),
                    rgba(0,0,0,0.65)
                ),
                url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 21px;
            margin-bottom: 30px;
        }

        .hero button {
            background: #2ecc71;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 15px 30px;

            font-size: 18px;

            cursor: pointer;
        }

        .hero button:hover {
            background: #27ae60;
        }

        /* ================= SECTIONS ================= */

        section {
            scroll-margin-top: 90px;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 35px;
        }

        /* ================= PRODUCTS ================= */

        .products-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .products {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 25px;
        }

        .product-card {
            background: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.15);
        }

        .product-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .description {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .price {
            color: #27ae60;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-button {
            width: 100%;

            padding: 13px;

            background: #17202a;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }

        .add-button:hover {
            background: #2ecc71;
        }

        .no-products {
            grid-column: 1 / -1;

            text-align: center;

            padding: 50px;

            background: white;

            border-radius: 10px;

            color: #7f8c8d;
        }

        /* ================= CART ================= */

        .cart-section {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .cart-box {
            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }

        .cart-item {
            display: flex;

            align-items: center;

            gap: 15px;

            padding: 15px 0;

            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 80px;
            height: 80px;

            object-fit: cover;

            border-radius: 8px;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h4 {
            margin-bottom: 5px;
        }

        .cart-price {
            color: #27ae60;
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .quantity-controls button {
            width: 32px;
            height: 32px;

            border: none;
            border-radius: 5px;

            background: #17202a;
            color: white;

            cursor: pointer;
        }

        .quantity-controls button:hover {
            background: #2ecc71;
        }

        .quantity {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .remove-button {
            background: #e74c3c !important;
        }

        .cart-total {
            text-align: right;

            font-size: 24px;
            font-weight: bold;

            margin-top: 25px;
        }

        .cart-buttons {
            display: flex;

            gap: 12px;

            margin-top: 20px;
        }

        .checkout-button,
        .clear-button {
            flex: 1;

            padding: 15px;

            border: none;
            border-radius: 6px;

            color: white;

            cursor: pointer;

            font-size: 16px;
        }

        .checkout-button {
            background: #27ae60;
        }

        .clear-button {
            background: #e74c3c;
        }

        .empty-cart {
            text-align: center;

            padding: 30px;

            color: #7f8c8d;
        }

        /* ================= CHECKOUT ================= */

        .checkout-section {
            max-width: 700px;

            margin: 60px auto;

            padding: 20px;
        }

        .checkout-box {
            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }

        .checkout-box h2 {
            text-align: center;

            margin-bottom: 25px;
        }

        .checkout-box input,
        .checkout-box textarea {
            width: 100%;

            padding: 15px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 16px;
        }

        .checkout-box textarea {
            height: 120px;

            resize: vertical;
        }

        .place-order-button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 6px;

            background: #25d366;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        .place-order-button:hover {
            background: #1ebe5d;
        }

        /* ================= SUMMARY ================= */

        .order-summary {
            background: #f8f9fa;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        .order-summary h3 {
            margin-bottom: 10px;
        }

        .summary-line {
            display: flex;

            justify-content: space-between;

            padding: 5px 0;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #17202a;

            color: white;

            text-align: center;

            padding: 30px;

            margin-top: 60px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header {
                padding: 15px 20px;

                flex-direction: column;

                gap: 12px;
            }

            nav {
                gap: 15px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 17px;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-buttons {
                flex-direction: column;
            }

            .cart-total {
                text-align: left;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header>

    <div class="logo">
        J&D Shop
    </div>

    <nav>

        <a href="#home">
            Home
        </a>

        <a href="#products">
            Products
        </a>

        <a href="#cart">
            🛒 Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>



<!-- =====================================================
     HERO
====================================================== -->

<section class="hero" id="home">

    <h1>
        Welcome to J&D Shop
    </h1>

    <p>
        Quality products at affordable prices.
    </p>

    <button onclick="goToProducts()">
        Shop Now
    </button>

</section>



<!-- =====================================================
     PRODUCTS
     
     IMPORTANT:
     Products are now loaded automatically from
     localStorage instead of being hard-coded.
====================================================== -->

<section
    class="products-section"
    id="products"
>

    <h2 class="section-title">
        Our Products
    </h2>


    <div
        class="products"
        id="products-container"
    >

    </div>

</section>



<!-- =====================================================
     CART
====================================================== -->

<section
    class="cart-section"
    id="cart"
>

    <h2 class="section-title">
        Your Shopping Cart
    </h2>


    <div class="cart-box">

        <div id="cart-items">

            <div class="empty-cart">
                Your cart is empty.
            </div>

        </div>


        <div class="cart-total">

            Total:
            <span id="cart-total">
                KSh 0
            </span>

        </div>


        <div class="cart-buttons">

            <button
                class="checkout-button"
                onclick="checkout()"
            >
                Proceed to Checkout
            </button>


            <button
                class="clear-button"
                onclick="clearCart()"
            >
                Clear Cart
            </button>

        </div>

    </div>

</section>



<!-- =====================================================
     CHECKOUT
====================================================== -->

<section
    class="checkout-section"
    id="checkout"
>

    <div class="checkout-box">

        <h2>
            Complete Your Order
        </h2>


        <div class="order-summary">

            <h3>
                Order Summary
            </h3>

            <div id="summary-items">
                No products selected.
            </div>

        </div>


        <form id="checkout-form">


            <input
                type="text"
                id="customer-name"
                placeholder="Your Full Name"
                required
            >


            <input
                type="tel"
                id="customer-phone"
                placeholder="Your Phone Number"
                required
            >


            <input
                type="text"
                id="customer-location"
                placeholder="Delivery Location"
                required
            >


            <textarea
                id="customer-notes"
                placeholder="Extra instructions (optional)"
            ></textarea>


            <button
                type="submit"
                class="place-order-button"
            >
                📱 Place Order via WhatsApp
            </button>

        </form>

    </div>

</section>



<!-- =====================================================
     FOOTER
====================================================== -->

<footer>

    <p>
        © 2026 J&D Shop
    </p>

    <p>
        WhatsApp: 0794520878
    </p>

</footer>



<script>


/* =====================================================
   PRODUCTS

   Products added through admin.html are stored here.
===================================================== */

let products =
    JSON.parse(
        localStorage.getItem("jdShopProducts")
    ) || [];



/* =====================================================
   SHOPPING CART
===================================================== */

let cart =
    JSON.parse(
        localStorage.getItem("jdShopCart")
    ) || [];



/* =====================================================
   WHATSAPP NUMBER

   0794520878
   becomes:
   254794520878
===================================================== */

const yourWhatsAppNumber =
    "254794520878";



/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts() {

    const container =
        document.getElementById(
            "products-container"
        );


    container.innerHTML = "";


    /* No products */

    if (products.length === 0) {

        container.innerHTML = `

            <div class="no-products">

                <h3>
                    No products available yet.
                </h3>

                <p>
                    Products will appear here
                    when they are added to J&D Shop.
                </p>

            </div>

        `;

        return;

    }


    /* Display every product */

    products.forEach(
        function(product) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <div class="product-info">

                    <h3>
                        ${product.name}
                    </h3>


                    <p class="description">
                        ${product.description}
                    </p>


                    <p class="price">

                        KSh
                        ${Number(product.price).toLocaleString()}

                    </p>


                    <button
                        class="add-button"
                        onclick="addToCart(
                            ${product.id}
                        )"
                    >
                        🛒 Add to Cart
                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   ADD PRODUCT TO CART
===================================================== */

function addToCart(productId) {


    const product =
        products.find(
            item =>
                item.id === productId
        );


    if (!product) {

        alert(
            "Product could not be found."
        );

        return;

    }


    const existingProduct =
        cart.find(
            item =>
                item.id === productId
        );


    if (existingProduct) {

        existingProduct.quantity++;

    }

    else {

        cart.push({

            id: product.id,

            name: product.name,

            price: Number(product.price),

            image: product.image,

            quantity: 1

        });

    }


    saveCart();

    updateCart();


    alert(
        product.name +
        " has been added to your cart."
    );

}



/* =====================================================
   SAVE CART
===================================================== */

function saveCart() {

    localStorage.setItem(
        "jdShopCart",
        JSON.stringify(cart)
    );

}



/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

    const cartItems =
        document.getElementById(
            "cart-items"
        );


    const cartCount =
        document.getElementById(
            "cart-count"
        );


    const cartTotal =
        document.getElementById(
            "cart-total"
        );


    cartItems.innerHTML = "";


    if (cart.length === 0) {

        cartItems.innerHTML = `

            <div class="empty-cart">

                Your cart is empty.

            </div>

        `;


        cartCount.textContent =
            "0";


        cartTotal.textContent =
            "KSh 0";


        updateOrderSummary();

        return;

    }


    let total = 0;

    let quantity = 0;


    cart.forEach(
        function(product, index) {


            const productTotal =
                product.price *
                product.quantity;


            total += productTotal;

            quantity += product.quantity;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "cart-item";


            item.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <div class="cart-details">

                    <h4>
                        ${product.name}
                    </h4>

                    <p class="cart-price">

                        KSh
                        ${product.price.toLocaleString()}

                    </p>

                </div>


                <div class="quantity-controls">

                    <button
                        onclick="decreaseQuantity(${index})"
                    >
                        −
                    </button>


                    <span class="quantity">
                        ${product.quantity}
                    </span>


                    <button
                        onclick="increaseQuantity(${index})"
                    >
                        +
                    </button>


                    <button
                        class="remove-button"
                        onclick="removeFromCart(${index})"
                    >
                        🗑
                    </button>

                </div>

            `;


            cartItems.appendChild(
                item
            );

        }
    );


    cartCount.textContent =
        quantity;


    cartTotal.textContent =
        "KSh " +
        total.toLocaleString();


    updateOrderSummary();

}



/* =====================================================
   INCREASE QUANTITY
===================================================== */

function increaseQuantity(index) {

    cart[index].quantity++;

    saveCart();

    updateCart();

}



/* =====================================================
   DECREASE QUANTITY
===================================================== */

function decreaseQuantity(index) {

    if (
        cart[index].quantity > 1
    ) {

        cart[index].quantity--;

    }

    else {

        cart.splice(index, 1);

    }


    saveCart();

    updateCart();

}



/* =====================================================
   REMOVE FROM CART
===================================================== */

function removeFromCart(index) {

    cart.splice(index, 1);

    saveCart();

    updateCart();

}



/* =====================================================
   CLEAR CART
===================================================== */

function clearCart() {

    if (cart.length === 0) {

        return;

    }


    const confirmation =
        confirm(
            "Are you sure you want to clear your cart?"
        );


    if (confirmation) {

        cart = [];

        saveCart();

        updateCart();

    }

}



/* =====================================================
   ORDER SUMMARY
===================================================== */

function updateOrderSummary() {

    const summary =
        document.getElementById(
            "summary-items"
        );


    if (cart.length === 0) {

        summary.innerHTML =
            "No products selected.";

        return;

    }


    let html = "";

    let total = 0;


    cart.forEach(
        function(product) {


            const productTotal =
                product.price *
                product.quantity;


            total += productTotal;


            html += `

                <div class="summary-line">

                    <span>
                        ${product.name}
                        × ${product.quantity}
                    </span>

                    <strong>
                        KSh
                        ${productTotal.toLocaleString()}
                    </strong>

                </div>

            `;

        }
    );


    html += `

        <hr>

        <div class="summary-line">

            <strong>
                TOTAL
            </strong>

            <strong>
                KSh ${total.toLocaleString()}
            </strong>

        </div>

    `;


    summary.innerHTML =
        html;

}



/* =====================================================
   GO TO PRODUCTS
===================================================== */

function goToProducts() {

    document
        .getElementById("products")
        .scrollIntoView({
            behavior: "smooth"
        });

}



/* =====================================================
   CHECKOUT
===================================================== */

function checkout() {

    if (cart.length === 0) {

        alert(
            "Your cart is empty. Add a product first."
        );

        return;

    }


    document
        .getElementById("checkout")
        .scrollIntoView({
            behavior: "smooth"
        });

}



/* =====================================================
   WHATSAPP ORDER
===================================================== */

document
    .getElementById("checkout-form")
    .addEventListener(
        "submit",
        function(event) {


            event.preventDefault();


            if (cart.length === 0) {

                alert(
                    "Your cart is empty."
                );

                return;

            }


            const name =
                document
                    .getElementById(
                        "customer-name"
                    )
                    .value
                    .trim();


            const phone =
                document
                    .getElementById(
                        "customer-phone"
                    )
                    .value
                    .trim();


            const location =
                document
                    .getElementById(
                        "customer-location"
                    )
                    .value
                    .trim();


            const notes =
                document
                    .getElementById(
                        "customer-notes"
                    )
                    .value
                    .trim();



            /* Create message */

            let message =
                "🛍️ NEW ORDER - J&D SHOP\n\n";


            message +=
                "👤 Customer: " +
                name +
                "\n";


            message +=
                "📞 Customer Phone: " +
                phone +
                "\n";


            message +=
                "📍 Delivery Location: " +
                location +
                "\n\n";


            message +=
                "🛒 PRODUCTS\n";


            message +=
                "--------------------------\n";


            let total = 0;


            cart.forEach(
                function(product) {


                    const productTotal =
                        product.price *
                        product.quantity;


                    total += productTotal;


                    message +=
                        product.name +
                        " × " +
                        product.quantity +
                        " = KSh " +
                        productTotal.toLocaleString() +
                        "\n";

                }
            );


            message +=
                "--------------------------\n";


            message +=
                "💰 TOTAL: KSh " +
                total.toLocaleString() +
                "\n";


            if (notes !== "") {

                message +=
                    "\n📝 Notes: " +
                    notes;

            }


            /* Encode WhatsApp message */

            const encodedMessage =
                encodeURIComponent(
                    message
                );


            /* Create WhatsApp URL */

            const whatsappURL =
                "https://wa.me/" +
                yourWhatsAppNumber +
                "?text=" +
                encodedMessage;


            /* Open WhatsApp */

            window.open(
                whatsappURL,
                "_blank"
            );


            /* Clear cart */

            cart = [];

            saveCart();

            updateCart();


            document
                .getElementById(
                    "checkout-form"
                )
                .reset();

        }
    );



/* =====================================================
   START WEBSITE
===================================================== */

displayProducts();

updateCart();

</script>


</body>

</html>
